# All spatial coordinates and cell sizes are SI (metres). Angular min/max
# values are fractions of pi. Densities are m^-3, temperatures are eV, and
# velocities are m/s.

[beams]
file = "../../beam_csvs/example_beam_csvs/example_beams.csv"
nrays_axis1 = 20
nrays_axis2 = 20
intensity_cutoff = 2e-4
neighbour_spacing_m = 1e-9
launch_padding = 10.0

[beams.power]
mode = "total_power"
total_power_w = 1.0e12

[physics.inverse_bremsstrahlung]
enabled = true
minimum_coulomb_log = 2.0

[raytracing]
nsamples_per_sheet = 20
diagnostic_samples = 512
maximum_path_length_grid_lengths = 100.0
# dt0 is omitted, so Diffrax selects the initial step adaptively.
# Dimensionless tolerances after automatic per-state scaling.
rtol = 1e-5
atol = 1e-7
max_steps = 4096
area_floor = 1e-12
minimum_amplitude_cap = 1.1

[grid]
geometry = "cylindrical"

[[grid.composition.elements]]
name = "carbon"
A = 12.0
Z = 6.0
fraction = 0.5

[[grid.composition.elements]]
name = "hydrogen"
A = 1.0
Z = 1.0
fraction = 0.5

[grid.axes.r]
min = 0.0
max = 0.01
spacing = "graded"
boundaries = [0.003, 0.007]
cell_sizes = [0.0002, 0.00005, 0.0002]
transition_widths = [0.001, 0.001]

[grid.axes.phi]
# NOTE THAT MIN AND MAX ARE FRACTIONS OF PI FOR ANGLES!
min = -1.0
max = 1.0
spacing = "uniform"
ncells = 64

[grid.axes.z]
min = -0.005
max = 0.005
spacing = "uniform"
ncells = 100

[grid.initial_condition]
name = "uniform"

[grid.initial_condition.parameters]
ne = 1.0
Te = 1.0
Ti = 1.0
velocity = [0.0, 0.0, 0.0]

[grid.safe_state]
ne = 1.0
Te = 1.0
Ti = 1.0
grad_ne = [0.0, 0.0, 0.0]
velocity = [0.0, 0.0, 0.0]
