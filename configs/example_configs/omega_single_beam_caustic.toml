# Reduced OMEGA caustic diagnostic: four primary rays in a narrow tube around
# the normal-incidence direction of OMEGA beam 17.

[beams]
file = "../../beam_csvs/example_beam_csvs/omega_single_beam_caustic.csv"
nrays_axis1 = 2
nrays_axis2 = 2
intensity_cutoff = 2e-4
neighbour_spacing_m = 1e-9
launch_padding = 10.0

[beams.power]
mode = "peak_intensity"

[physics.inverse_bremsstrahlung]
enabled = true
minimum_coulomb_log = 2.0

[raytracing]
nsamples_per_sheet = 64
diagnostic_samples = 2048
maximum_path_length_grid_lengths = 10.0
rtol = 1e-6
atol = 1e-8
max_steps = 4096
area_floor = 1e-12
minimum_amplitude_cap = 1.1

[grid]
geometry = "spherical"

[[grid.composition.elements]]
name = "effective_ion"
A = 5.6609
Z = 3.1
fraction = 1.0

[grid.axes.r]
min = 3.47141781908e-4
max = 1.2e-3
spacing = "graded"
boundaries = [4.5e-4, 7.0e-4]
cell_sizes = [5e-6, 15e-6, 50e-6]
transition_widths = [8e-5, 2e-4]

[grid.axes.phi]
min = -1.0
max = 1.0
spacing = "uniform"
ncells = 80

[grid.axes.theta]
min = 0.0
max = 1.0
spacing = "uniform"
ncells = 40

[grid.initial_condition]
name = "omega_lilac_fit"

[grid.initial_condition.parameters]
omega_rad_s = 5.36e15
scale = 1.0
electron_temperature_ev = 2.0e3
ion_temperature_over_electron = 0.5
ion_charge = 3.1
ion_mass_over_electron_mass = 10319.2

[grid.safe_state]
ne = 1.0
Te = 2.0e3
Ti = 1.0e3
grad_ne = [0.0, 0.0, 0.0]
velocity = [0.0, 0.0, 0.0]
