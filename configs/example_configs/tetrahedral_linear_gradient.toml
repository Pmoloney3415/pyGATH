# Four parallel rays incident at 20 degrees from +x towards +y. Two launch
# samples in each spot direction provide a 2 x 2 transverse ray lattice. Once
# independently advanced to the minimum-x grid face, the primary rays form a
# 100 um x 100 um rectangle in Cartesian y-z. The beam-plane axis-1 width in
# the CSV includes the cos(20 degrees) projection needed to achieve this.

[beams]
file = "../../beam_csvs/example_beam_csvs/tetrahedral_linear_gradient_beam.csv"
nrays_axis1 = 2
nrays_axis2 = 2
intensity_cutoff = 2e-4
neighbour_spacing_m = 1e-9
launch_padding = 10.0

[beams.power]
mode = "total_power"
total_power_w = 1.0e12

[physics.inverse_bremsstrahlung]
enabled = false
minimum_coulomb_log = 2.0

[raytracing]
nsamples_per_sheet = 10
diagnostic_samples = 1024
maximum_path_length_grid_lengths = 10.0
# dt0 is omitted, so Diffrax selects the initial step adaptively.
rtol = 1e-5
atol = 1e-7
max_steps = 4096
area_floor = 1e-12
minimum_amplitude_cap = 1.1

[grid]
geometry = "cartesian"

[[grid.composition.elements]]
name = "hydrogen"
A = 1.0
Z = 1.0
fraction = 1.0

[grid.axes.x]
min = -0.1e-3
max = 1.1e-3
spacing = "uniform"
ncells = 64

[grid.axes.y]
min = -1e-4
max = 1.4e-3
spacing = "uniform"
ncells = 24

[grid.axes.z]
min = -0.5e-3
max = 0.5e-3
spacing = "uniform"
ncells = 2

[grid.initial_condition]
name = "linear_density_x"

[grid.initial_condition.parameters]
# ncrit(omega=5.361e15 rad/s) / (1 mm)
dne_dx = 9.030432548648287e30
ne_at_x_min = 0.0
Te = 1.0
Ti = 1.0
velocity = [0.0, 0.0, 0.0]

[grid.safe_state]
ne = 0.0
Te = 1.0
Ti = 1.0
grad_ne = [0.0, 0.0, 0.0]
velocity = [0.0, 0.0, 0.0]
