# Analytic uniform-plasma inverse-bremsstrahlung deposition test.

[beams]
file = "../../beam_csvs/example_beam_csvs/uniform_1d_deposition.csv"
nrays_axis1 = 1
nrays_axis2 = 1
neighbour_spacing_m = 1e-9
launch_padding = 2.0

[beams.power]
mode = "total_power"
total_power_w = 1.0e12

[physics.inverse_bremsstrahlung]
enabled = true
critical_collision_frequency_hz = 2.0645e14

[raytracing]
nsamples_per_sheet = 2049
diagnostic_samples = 512
maximum_path_length_grid_lengths = 3.0
rtol = 1e-7
atol = 1e-9
max_steps = 4096
area_floor = 1e-12
minimum_amplitude_cap = 1.1

[grid]
geometry = "cartesian"
dimensions = 1
inactive_axis_lengths_m = [1.0, 1.0]

[[grid.composition.elements]]
name = "hydrogen"
A = 1.0
Z = 1.0
fraction = 1.0

[grid.axes.x]
min = 0.0
max = 4.0e-5
spacing = "uniform"
ncells = 128

[grid.initial_condition]
name = "uniform"

[grid.initial_condition.parameters]
ne = 9.049067927121267e26
Te = 70.0
Ti = 35.0

[grid.safe_state]
# Match the surrounding medium so a ray initialized a rounding ulp outside the
# boundary has the uniform-plasma refractive momentum before entering the slab.
ne = 9.049067927121267e26
Te = 70.0
Ti = 35.0
grad_ne = [0.0, 0.0, 0.0]
velocity = [0.0, 0.0, 0.0]

[deposition]
max_subdivision_levels = 2
relative_tolerance = 1e-3
simplex_batch_size = 512
