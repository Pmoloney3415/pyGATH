# A single ray incident at 20 degrees from +x towards +y. The density rises
# from vacuum as ne/ncrit = x / (1 mm), so geometrical optics predicts
# x_turn = (1 mm) cos(20 deg)^2.

[beams]
file = "../../beam_csvs/test_beam_csvs/linear_gradient_turning_beam.csv"
nrays_axis1 = 1
nrays_axis2 = 1
intensity_cutoff = 2e-4
neighbour_spacing_m = 1e-9
launch_padding = 10.0

[beams.power]
mode = "total_power"
total_power_w = 1.0

[physics.inverse_bremsstrahlung]
enabled = false
minimum_coulomb_log = 2.0

[raytracing]
nsamples_per_sheet = 40
diagnostic_samples = 1024
maximum_path_length_grid_lengths = 10.0
# dt0 is omitted, so Diffrax selects the initial step adaptively.
# Dimensionless tolerances after automatic per-state scaling.
rtol = 1e-5
atol = 1e-7
max_steps = 4096
area_floor = 1e-12
minimum_amplitude_cap = 1.1

[grid]
geometry = "cartesian"

[[grid.composition.elements]]
name = "hydrogen"
A = 1.0
Z = 1.0
fraction = 1.0

[grid.axes.x]
min = 0.0
max = 1.1e-3
spacing = "uniform"
ncells = 64

[grid.axes.y]
min = -5e-5
max = 1.4e-3
spacing = "uniform"
ncells = 16

[grid.axes.z]
# z is out of the propagation plane and deliberately has only one cell.
min = -5e-6
max = 5e-6
spacing = "uniform"
ncells = 1

[grid.initial_condition]
name = "linear_density_x"

[grid.initial_condition.parameters]
# ncrit(omega=5.361e15 rad/s) / (1 mm)
dne_dx = 9.030432548648287e30
ne_at_x_min = 0.0
Te = 1.0
Ti = 1.0
velocity = [0.0, 0.0, 0.0]

[grid.safe_state]
# Exact vacuum outside the finite hydro mesh.
ne = 0.0
Te = 1.0
Ti = 1.0
grad_ne = [0.0, 0.0, 0.0]
velocity = [0.0, 0.0, 0.0]
